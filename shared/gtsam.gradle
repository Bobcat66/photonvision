nativeUtils {
    nativeDependencyContainer {
        gtsam(getNativeDependencyTypeClass('WPIStaticMavenDependency')) {
            groupId = "org.wpilib.thirdparty.gtsam"
            artifactId = "gtsam-cpp"
            headerClassifier = "headers"
            sourceClassifier = "static"
            ext = "zip"
            version = rootProject.ext.gtsamThirdPartyVersion
            targetPlatforms.addAll(nativeUtils.wpi.platforms.allPlatforms)
        }
    }
}

ext {
    gtsamArgs = { binary ->
        if (binary.toolChain instanceof GccCompatibleToolChain) {
            binary.cppCompiler.define '_ENABLE_EXTENDED_ALIGNED_STORAGE'
            binary.cppCompiler.args.add("-Wno-deprecated-declarations")
            binary.cppCompiler.args.add("-Wno-deprecated-copy")
            binary.cppCompiler.args.add("-Wno-redundant-move")
        }
    }
}
